name: Test

on:
  pull_request:

env:
  FORCE_COLOR: 2
  NODE: 22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '${{ env.NODE }}'
          cache: 'npm'

      # Nothing here needs the Hugo binary that hugo-bin's postinstall downloads.
      - run: npm ci --ignore-scripts

      - run: npm run test-eslint
      - run: npm run test-stylelint
      - run: npm run test-markdownlint
      - run: npm run test-fusv
      - run: npm run test-lockfile-lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '${{ env.NODE }}'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run test-prettier

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '${{ env.NODE }}'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run test-typecheck

  # No unit tests here — the built site is what is under test, so this job builds it and
  # validates the HTML and links it produces.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '${{ env.NODE }}'
          cache: 'npm'

      # vnu-jar needs a JRE.
      - run: java -version

      # Full install: the build needs the Hugo binary from hugo-bin's postinstall.
      - name: Install npm dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate HTML
        run: npm run test-vnu

      - name: Check links
        run: npm run test-linkinator
